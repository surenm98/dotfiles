# BACKGROUND
background {
    monitor =
    # REMEMBER TO PUT YOUR WALLPAPER PATH HERE AGAIN
    path = /home/asta/Pictures/Wallpapers/wallhaven_zpmp8y.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TIME (Win 11 Style)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# DATE (Win 11 Style)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# PROFILE PICTURE 
image {
    monitor =
    # PUT THE PATH TO YOUR ACTUAL PROFILE PICTURE HERE!
    path = /home/asta/Pictures/Wallpapers/wallhaven_r26w8q.jpg
    size = 120
    rounding = -1 # Makes it a perfect circle
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, -50
    halign = center
    valign = center
}

# USERNAME TEXT (Welcome screen)
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}

# INPUT FIELD (Clean & Minimalist)
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
    position = 0, -190
    halign = center
    valign = center
}
